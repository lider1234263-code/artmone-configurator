name: Import gallery chunks

on:
  push:
    branches: [main]
    paths:
      - 'assets/import/chunk_*.txt'
      - '.github/workflows/import-gallery-zips.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import AM1 and AM850 galleries
        shell: bash
        run: |
          set -euo pipefail
          expected=6
          count=$(find assets/import -maxdepth 1 -name 'chunk_*.txt' | wc -l)
          if [ "$count" -ne "$expected" ]; then
            echo "Waiting for all chunks: $count/$expected"
            exit 0
          fi
          cat assets/import/chunk_00.txt assets/import/chunk_01.txt assets/import/chunk_02.txt assets/import/chunk_03.txt assets/import/chunk_04.txt assets/import/chunk_05.txt > /tmp/bundle.b64
          base64 -d /tmp/bundle.b64 > /tmp/bundle.zip
          unzip -t /tmp/bundle.zip
          mkdir -p assets/mockups
          unzip -o /tmp/bundle.zip -d assets/mockups
          rm -f assets/import/chunk_*.txt assets/import/bundle.zip
          git config user.name 'ArtMone Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/mockups assets/import
          git commit -m 'Import AM1 and AM850 gallery images' || exit 0
          git push
