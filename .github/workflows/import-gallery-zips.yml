name: Import gallery bundle

on:
  push:
    branches: [main]
    paths:
      - 'assets/import/bundle.zip'
      - '.github/workflows/import-gallery-zips.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import AM1 and AM850 galleries
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f assets/import/bundle.zip ]; then
            exit 0
          fi
          mkdir -p assets/mockups
          unzip -o assets/import/bundle.zip -d assets/mockups
          rm assets/import/bundle.zip
          git config user.name 'ArtMone Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/mockups assets/import
          git commit -m 'Import AM1 and AM850 gallery images' || exit 0
          git push
