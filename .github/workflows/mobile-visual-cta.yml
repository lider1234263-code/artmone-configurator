name: Add mobile visualization CTA

on:
  push:
    paths:
      - '.github/workflows/mobile-visual-cta.yml'
      - 'scripts/patch_mobile_visual_cta.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile visualization CTA
        run: python scripts/patch_mobile_visual_cta.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'ArtMone Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add mobile CTA back to product visualization'
          git push
