name: Unpack AM1 gallery

on:
  push:
    paths:
      - 'assets/mockups/am-1/am1_gallery_webp.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack optimized AM1 images
        run: |
          mkdir -p assets/mockups/am-1
          unzip -o assets/mockups/am-1/am1_gallery_webp.zip -d assets/mockups/am-1
          rm assets/mockups/am-1/am1_gallery_webp.zip
          rm -f assets/mockups/am-1/.gitkeep
      - name: Commit gallery files
        run: |
          git config user.name 'ArtMone Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/mockups/am-1
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Add optimized AM 1 gallery images'
          git push
