name: Apply iOS button color fix

on:
  push:
    paths:
      - '.github/workflows/ios-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch iOS Safari button colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}'
          new = old + 'button,input,select,textarea{color:inherit;-webkit-text-fill-color:currentColor}button{-webkit-appearance:none;appearance:none}.link{color:var(--text);-webkit-text-fill-color:var(--text)}'
          if new in s:
              print('Patch already applied')
          elif old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Patch applied')
          else:
              raise SystemExit('Target CSS not found')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'ArtMone Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix iOS Safari blue button text'
          git push
