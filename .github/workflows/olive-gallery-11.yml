name: Olive gallery 11-card test

on:
  push:
    paths:
      - '.github/workflows/olive-gallery-11.yml'
      - 'scripts/patch_olive_gallery.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gallery
        run: python scripts/patch_olive_gallery.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'ArtMone Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Test AM567 with 11 studio gallery cards and expand view'
          git push
